components:
  schemas:
    CreateData:
      additionalProperties: false
      properties:
        expires_at:
          description: 초대 코드 만료 시각
          format: date-time
          type: string
        serial_number:
          description: 방 초대 시리얼 코드
          type: string
      required:
        - serial_number
        - expires_at
      type: object
    Credentials:
      additionalProperties: false
      properties:
        password:
          description: base64(HMAC-SHA1(secret, username))로 계산된 임시 비밀번호
          type: string
        ttl:
          description: 자격증명 유효 기간(초). 발급 시점 기준
          examples:
            - 3600
          format: int64
          type: integer
        uris:
          description: 접속 대상 TURN 서버 주소 목록(하나 이상)
          items:
            type: string
          type:
            - array
            - "null"
        username:
          description: TURN 접속 사용자명. {만료_unix_timestamp}:cobrowsing 형식
          examples:
            - 1716003600:cobrowsing
          type: string
      required:
        - username
        - password
        - ttl
        - uris
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    PingData:
      additionalProperties: false
      properties:
        message:
          description: 항상 pong
          examples:
            - pong
          type: string
      required:
        - message
      type: object
    SuccessResponseCreateDataBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SuccessResponseCreateDataBody.json
          format: uri
          readOnly: true
          type: string
        data:
          $ref: "#/components/schemas/CreateData"
      required:
        - data
      type: object
    SuccessResponseCredentialsBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SuccessResponseCredentialsBody.json
          format: uri
          readOnly: true
          type: string
        data:
          $ref: "#/components/schemas/Credentials"
      required:
        - data
      type: object
    SuccessResponsePingDataBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/SuccessResponsePingDataBody.json
          format: uri
          readOnly: true
          type: string
        data:
          $ref: "#/components/schemas/PingData"
      required:
        - data
      type: object
info:
  title: Co-Browsing Session Server
  version: 1.0.0
openapi: 3.1.0
paths:
  /ping:
    get:
      description: 서버가 살아있는지 확인합니다.
      operationId: ping
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponsePingDataBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 헬스 체크
      tags:
        - system
  /rooms:
    post:
      description: 새 RoomSession과 초대 코드를 발급합니다.
      operationId: createRoom
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponseCreateDataBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: 새 방 생성
      tags:
        - rooms
  /turn-credentials:
    get:
      description: WebRTC 폴백용 TURN 중계 서버 단기 접속 자격증명을 발급합니다.
      operationId: getTURNCredentials
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponseCredentialsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: TURN 자격증명 발급
      tags:
        - turn
